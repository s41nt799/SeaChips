<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Админка — Sea Chips</title>
  <link rel="stylesheet" href="css/sea-chips.css" />
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://yaukapdyrbefzrifqifa.supabase.co'
    const supabaseKey = 'sb_publishable_KbCQKRekMG883j7KYPz9EQ_Wei3_HeH'
    window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)
  </script>
  
  <style>
    .admin-page { padding: 32px 0; }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .admin-header h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
    }
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .admin-stat {
      background: var(--surface);
      padding: 16px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      text-align: center;
    }
    .admin-stat__number {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--sea-dark);
    }
    .admin-stat__label {
      font-size: 0.875rem;
      color: var(--muted);
    }
    .orders-table-wrap {
      overflow-x: auto;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }
    .orders-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    .orders-table th {
      background: var(--surface);
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
    }
    .orders-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .orders-table tr:hover { background: var(--sea-light); }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-processing { background: #dbeafe; color: #1e40af; }
    .status-shipped { background: #d1fae5; color: #065f46; }
    .status-delivered { background: #d1fae5; color: #065f46; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    .admin-refresh {
      padding: 8px 16px;
      background: var(--sea);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.875rem;
    }
    .admin-refresh:hover { opacity: 0.8; }
    .admin-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    @media (max-width: 600px) {
      .orders-table th, .orders-table td { padding: 8px 10px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="home.html" class="logo">
        <span class="logo-mark">🌊</span> Sea Chips · Админка
      </a>
      <nav class="nav-desktop">
        <a href="home.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="admin.html" class="active">Заказы</a>
      </nav>
    </div>
  </header>

  <main class="container admin-page">
    <div class="admin-header">
      <h1>📋 Заказы</h1>
      <button class="admin-refresh" onclick="loadOrders()">🔄 Обновить</button>
    </div>

    <div class="admin-stats" id="admin-stats">
      <div class="admin-stat">
        <div class="admin-stat__number" id="stat-total">0</div>
        <div class="admin-stat__label">Всего заказов</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__number" id="stat-today">0</div>
        <div class="admin-stat__label">Сегодня</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__number" id="stat-pending">0</div>
        <div class="admin-stat__label">В обработке</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__number" id="stat-revenue">0 ₽</div>
        <div class="admin-stat__label">Выручка</div>
      </div>
    </div>

    <div class="orders-table-wrap">
      <div id="orders-container">
        <div class="admin-loading">⏳ Загрузка заказов...</div>
      </div>
    </div>
  </main>

  <script>
    let allOrders = [];

    async function loadOrders() {
      const container = document.getElementById('orders-container');
      container.innerHTML = '<div class="admin-loading">⏳ Загрузка...</div>';
      
      try {
        const { data, error } = await window.supabaseClient
          .from('orders')
          .select('*')
          .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        allOrders = data || [];
        renderOrders(allOrders);
        renderStats(allOrders);
        
      } catch (error) {
        container.innerHTML = `
          <div class="admin-loading">
            ❌ Ошибка: ${error.message}
            <br><br>
            <button class="admin-refresh" onclick="loadOrders()">🔄 Попробовать снова</button>
          </div>
        `;
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('orders-container');
      
      if (!orders.length) {
        container.innerHTML = `
          <div class="admin-loading">
            📭 Заказов пока нет
            <br><br>
            <button class="admin-refresh" onclick="loadOrders()">🔄 Обновить</button>
          </div>
        `;
        return;
      }

      let html = `
        <table class="orders-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Клиент</th>
              <th>Телефон</th>
              <th>Товары</th>
              <th>Сумма</th>
              <th>Статус</th>
              <th>Дата</th>
            </tr>
          </thead>
          <tbody>
      `;

      orders.forEach(order => {
        const statusClass = `status-${order.status || 'pending'}`;
        const statusLabel = {
          pending: '🟡 В обработке',
          processing: '🔵 Готовится',
          shipped: '🟢 Отправлен',
          delivered: '✅ Доставлен',
          cancelled: '❌ Отменён'
        }[order.status] || order.status;

        const items = order.items || [];
        const itemsShort = items.map(i => i.name).join(', ');

        html += `
          <tr>
            <td><strong>${order.order_number}</strong></td>
            <td>${order.customer_name}</td>
            <td>${order.customer_phone}</td>
            <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${itemsShort}">${itemsShort || '—'}</td>
            <td><strong>${order.total} ₽</strong></td>
            <td><span class="status ${statusClass}">${statusLabel}</span></td>
            <td style="font-size:0.8rem;color:var(--muted);">${new Date(order.created_at).toLocaleString('ru-RU')}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function renderStats(orders) {
      document.getElementById('stat-total').textContent = orders.length;
      
      const today = new Date().toDateString();
      const todayOrders = orders.filter(o => new Date(o.created_at).toDateString() === today);
      document.getElementById('stat-today').textContent = todayOrders.length;
      
      const pending = orders.filter(o => o.status === 'pending' || o.status === 'processing');
      document.getElementById('stat-pending').textContent = pending.length;
      
      const revenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);
      document.getElementById('stat-revenue').textContent = revenue.toLocaleString('ru-RU') + ' ₽';
    }

    loadOrders();
    setInterval(loadOrders, 30000);
  </script>
</body>
</html>
