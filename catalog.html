<script src="js/sea-chips.js"></script>

<script>
  // Ждём полной загрузки DOM и товаров
  document.addEventListener('DOMContentLoaded', async function() {
    console.log('DOM загружен');
    
    // Ждём загрузки товаров из Supabase
    const products = await SeaChips.loadProducts();
    console.log('Товаров загружено:', products.length);
    
    const grid = document.getElementById('catalog-grid');
    const countSpan = document.getElementById('catalog-count');
    const emptyState = document.getElementById('empty-state');
    
    console.log('Контейнер найден:', grid);
    
    if (!grid) {
      console.error('Контейнер catalog-grid не найден!');
      return;
    }
    
    function renderGrid(list) {
      if (!list.length) {
        emptyState.style.display = 'block';
        grid.innerHTML = '';
        countSpan.textContent = '0 товаров';
        return;
      }
      
      emptyState.style.display = 'none';
      countSpan.textContent = list.length + ' ' + getProductWord(list.length);
      grid.innerHTML = '';
      list.forEach(p => {
        grid.insertAdjacentHTML('beforeend', SeaChips.renderProductCard(p));
      });
      SeaChips.bindAddToCartButtons(grid);
    }
    
    function getProductWord(n) {
      if (n % 10 === 1 && n % 100 !== 11) return 'товар';
      if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return 'товара';
      return 'товаров';
    }
    
    let currentProducts = [...products];
    renderGrid(currentProducts);
    
    // Сортировка
    document.getElementById('sort-select').addEventListener('change', e => {
      const sorted = [...currentProducts];
      switch(e.target.value) {
        case 'price-asc': sorted.sort((a,b) => a.price - b.price); break;
        case 'price-desc': sorted.sort((a,b) => b.price - a.price); break;
        case 'name': sorted.sort((a,b) => a.name.localeCompare(b.name)); break;
      }
      renderGrid(sorted);
    });
    
    // Фильтры
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        const filter = this.dataset.filter;
        document.querySelectorAll(`.filter-chip[data-filter="${filter}"]`).forEach(c => {
          if (c !== this) c.classList.remove('active');
        });
        this.classList.toggle('active');
        
        const activeFlavor = document.querySelector('.filter-chip[data-filter="flavor"].active')?.dataset.value;
        const activeFormat = document.querySelector('.filter-chip[data-filter="format"].active')?.dataset.value;
        
        const filtered = products.filter(p => {
          if (activeFlavor && p.flavor !== activeFlavor) return false;
          if (activeFormat && p.format !== activeFormat) return false;
          return true;
        });
        currentProducts = filtered;
        renderGrid(currentProducts);
      });
    });
    
    function clearAllFilters() {
      document.querySelectorAll('.filter-chip.active').forEach(c => c.classList.remove('active'));
      currentProducts = [...products];
      renderGrid(currentProducts);
    }
    
    document.getElementById('clear-filters')?.addEventListener('click', clearAllFilters);
    document.getElementById('clear-filters-2')?.addEventListener('click', clearAllFilters);
    
    // ========== ОБНОВЛЕНИЕ БЕЙДЖА КОРЗИНЫ (ДОБАВЛЕНО) ==========
    function updateBadge() {
      var badge = document.querySelector('.cart-badge');
      if (badge) {
        var count = SeaChips.getCartCount() || 0;
        badge.textContent = count;
      }
    }
    updateBadge();
    window.addEventListener('cart:updated', updateBadge);
  });
</script>
